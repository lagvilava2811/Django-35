<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Catalog{% endblock %}</title>
  <style>
    :root { --ink:#18212f; --muted:#657083; --line:#e6eaf0; --brand:#4f46e5; --sale:#dc2626; --bg:#f7f8fc; }
    * { box-sizing:border-box; } body { margin:0; font-family:Inter,Segoe UI,Arial,sans-serif; color:var(--ink); background:var(--bg); }
    header { background:#fff; border-bottom:1px solid var(--line); } .nav, main { width:min(1080px, calc(100% - 32px)); margin:auto; }
    .nav { min-height:70px; display:flex; gap:24px; align-items:center; } .brand { font-size:1.25rem; font-weight:800; margin-right:auto; color:var(--ink); text-decoration:none; }
    .nav a { color:var(--muted); text-decoration:none; font-weight:650; } .nav a:hover { color:var(--brand); } main { padding:42px 0 64px; }
    h1 { margin:0 0 8px; font-size:2rem; } .lead { color:var(--muted); margin:0 0 28px; } .layout { display:grid; grid-template-columns:260px 1fr; gap:26px; }
    .panel, .card { background:#fff; border:1px solid var(--line); border-radius:16px; } .panel { padding:20px; height:max-content; } .panel h2 { margin:0 0 14px; font-size:1rem; }
    .categories { list-style:none; padding:0; margin:0; display:grid; gap:6px; } .categories a { display:flex; justify-content:space-between; color:var(--ink); padding:9px 10px; border-radius:8px; text-decoration:none; }
    .categories a:hover { background:#eef2ff; color:var(--brand); } .grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(210px, 1fr)); gap:16px; }
    .card { padding:18px; min-height:170px; display:flex; flex-direction:column; } .tag { background:#fee2e2; color:var(--sale); font-size:.72rem; font-weight:800; padding:5px 8px; border-radius:999px; width:max-content; margin-bottom:12px; }
    .category { color:var(--brand); font-size:.82rem; font-weight:700; margin-bottom:8px; } .name { font-size:1.08rem; font-weight:800; margin:0 0 8px; }
    .description { color:var(--muted); font-size:.9rem; margin:0 0 18px; line-height:1.45; } .price { margin-top:auto; font-size:1.15rem; font-weight:850; }
    .empty { background:#fff; border:1px dashed #b7c0d0; padding:24px; border-radius:14px; color:var(--muted); } @media (max-width:720px) { .layout { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <header><nav class="nav"><a class="brand" href="{% url 'home' %}">Store Catalog</a><a href="{% url 'home' %}">Available products</a><a href="{% url 'sale_products' %}">Sale products</a></nav></header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
