{% extends 'store/base.html' %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<a class="back" href="{% url 'home' %}">ყველა პროდუქტზე დაბრუნება</a>
<article class="form-card">
  <p class="eyebrow">კატალოგის მართვა</p>
  <h1>{{ title }}</h1>
  <p class="lead">შეავსე პროდუქტის ინფორმაცია და შეინახე ცვლილება.</p>
  <form method="post">
    {% csrf_token %}
    {{ form.non_field_errors }}
    {{ form.as_p }}
    <div class="actions">
      <button class="button" type="submit">შენახვა</button>
      <a class="button button-secondary" href="{% if product %}{% url 'product_detail' product.id %}{% else %}{% url 'home' %}{% endif %}">გაუქმება</a>
    </div>
  </form>
</article>
{% endblock %}
