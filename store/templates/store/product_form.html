{% extends 'store/base.html' %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<a class="back" href="{% url 'home' %}">← ყველა პროდუქტზე დაბრუნება</a>
<article class="detail-card">
  <h1>{{ title }}</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">შენახვა</button>
  </form>
</article>
{% endblock %}
